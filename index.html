<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/font.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.png"/>
    <script defer src="./templates.js"></script>
    <script defer src="./script.js"></script>
    <title>Fotogram</title>

</head>
<body onload="render(event)">
    <header class="header" aria-label="Fotogram Logo">
        <!--Fotogram Logo-->
        <div class="header-logo">
            <img src="./assets/icons/header_logo.png" alt="Fotogram Header Logo">
        </div>
    </header>

    <main>
        <!--Bildergalerie-->
        <section class="main-content" aria-labelledby="headline">
            <h1 class="headline">My personal photo album</h1>
            <div id="content-box" aria-label="Bildergalerie"></div>
            
            <dialog id="myDialog" class="my-dialog" aria-labelledby="headlineDialog">
                <header class="header-dialog">
                    <h2 id="headlineDialog" aria-label="Bildname" tabindex="-1"></h2>
                    <button id="btnDialog" class="btn-dialog" aria-label="Dialog schließen" onclick="closeDialog(event)"></button>
                </header>
                <section id="contentDialog" class="content-dialog" onclick="closeDialog"></section>
                <footer id="footerDialog" class="footer-dialog" onclick="closeDialog"></footer>
            </dialog>
        </section>
    </main>

    <footer class="footer">
        <!--DA Logo & Copyright-->
        <div class="footer-content">
            <img src="./assets/icons/da_logo.png" alt="Footer DA Logo">
            <p>&copy; 2023 Developer Akademie GmbH</p>
        </div>
    </footer>
</body>

</html>
